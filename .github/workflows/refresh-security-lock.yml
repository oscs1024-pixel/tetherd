name: Refresh security lockfile

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Refresh patched dependencies
        run: |
          cargo update -p rand --precise 0.8.6
          cargo update -p tokio --precise 1.44.2
      - name: Verify stable toolchain
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
      - name: Verify MSRV
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.82.0 check --locked --all-targets --all-features
      - name: Verify RustSec
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git commit -m "build: refresh audited dependency lockfile"
          git push origin HEAD:main

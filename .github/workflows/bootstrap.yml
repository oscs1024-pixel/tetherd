name: Bootstrap source

on:
  push:
    paths:
      - "bootstrap/parts/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore audited source tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/parts/part-00a bootstrap/parts/part-00b bootstrap/parts/part-01 bootstrap/parts/part-02 bootstrap/parts/part-03 bootstrap/parts/part-04 | base64 -d > /tmp/tetherd-source.tar.gz
          echo "49ab144e20e0371badfc600668678378b3b9110ba105c9f66e1d3b054a8ad0f8  /tmp/tetherd-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tetherd-source.tar.gz -C .
          sed -i 's/toml = "=0.8.19"/toml = "=0.8.23"/' Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/logging.rs")
          s = p.read_text()
          old = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, clap::ValueEnum)]
#[serde(rename_all = "lowercase")]
pub enum ColorMode {
    Auto,
    Always,
    Never,
}

impl Default for ColorMode {
    fn default() -> Self {
        Self::Auto
    }
}
'''
          new = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, clap::ValueEnum, Default)]
#[serde(rename_all = "lowercase")]
pub enum ColorMode {
    #[default]
    Auto,
    Always,
    Never,
}
'''
          if old not in s:
              raise SystemExit("logging.rs patch target not found")
          p.write_text(s.replace(old, new))
          PY
          rm -rf bootstrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format and lock dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Stable toolchain verification
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          cargo build --release
      - name: Install MSRV
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: MSRV verification
        run: cargo +1.82.0 check --all-targets --all-features
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement production-ready tetherd"
          git push origin HEAD:main

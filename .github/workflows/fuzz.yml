name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 6"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # pinned
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz encrypted frame parser
        run: cargo fuzz run cipher_open -- -max_total_time=60
      - name: Fuzz protocol JSON
        run: cargo fuzz run message_json -- -max_total_time=60

[log]
level = "info"
color = "auto"

[auth]
credential = "pair"
# Exactly one PSK source is required. The file must be owner-only (0600) on Unix.
psk_file = "/etc/tetherd/psk"
# psk_env = "TETHERD_PSK"

[daemon]
listen = "0.0.0.0:1234"
control_socket = "/run/tetherd/tetherd.sock"
heartbeat_timeout_secs = 180
handshake_timeout_secs = 10
max_connections = 128
control_timeout_secs = 30
control_request_timeout_secs = 5
max_control_connections = 64
write_timeout_secs = 10
exec_output_idle_timeout_secs = 15
max_handshakes_per_minute = 600
max_handshakes_per_ip_per_minute = 120

[join]
server = "203.0.113.10:1234"
name = "alice"
heartbeat_secs = 60
heartbeat_timeout_secs = 180
reconnect_secs = 5
connect_timeout_secs = 10
write_timeout_secs = 10

[exec]
max_timeout_secs = 30
max_output_bytes = 1048576
max_concurrent = 4
# Child processes always receive an empty inherited environment.
inherit_env = false
drain_grace_secs = 2
# work_dir = "/var/empty"

# Remote callers address profiles by ID and cannot choose executable paths.
[exec.commands.echo]
program = "/bin/echo"
allow_user_args = true
max_user_args = 8
max_user_arg_bytes = 4096

[exec.commands.uptime]
program = "/usr/bin/uptime"
allow_user_args = false
